spring:
  application:
    name: burger-order-api

  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:13306/burger_order?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:burger_app}
    # Local-development default only. Override DB_PASSWORD outside this lab.
    password: ${DB_PASSWORD:burger_dev_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: burger-hikari
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2
      connection-timeout: 3000
      validation-timeout: 2000
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16379}
      timeout: 300ms
      connect-timeout: 300ms

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    connect-retries: 5
    connect-retries-interval: 3

  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: BURGER_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
        path: /
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
    prometheus:
      access: unrestricted
  prometheus:
    metrics:
      export:
        enabled: true
  health:
    db:
      enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [traceId=%X{traceId:-}] %logger{36} - %msg%n"
  level:
    com.burgerlab: ${LOG_LEVEL:INFO}

app:
  cache:
    menu:
      enabled: ${MENU_CACHE_ENABLED:true}
      ttl-seconds: ${MENU_CACHE_TTL_SECONDS:60}
      ttl-jitter-seconds: ${MENU_CACHE_TTL_JITTER_SECONDS:15}
      negative-ttl-seconds: ${MENU_CACHE_NEGATIVE_TTL_SECONDS:10}
  order:
    timeout-scan:
      enabled: true
      initial-delay-ms: 30000
      fixed-delay-ms: 60000
      batch-size: 100

info:
  app:
    name: ${spring.application.name}
    description: Multi-store burger ordering lab backend
    stage: "0"
